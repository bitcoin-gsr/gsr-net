# gsr-net public node, installed as /etc/gsr-net/bitcoin.conf.
# signet=1 rather than chain=signet: the signet miner passes -signet itself.
signet=1
server=1
txindex=1
dnsseed=0
fallbackfee=0.00001

# Network-specific options only take effect inside the section.
[signet]
signetchallenge=0014fc65bb67e5653778c206cfe6aca97084d817cb79
vbparams=tapleaf_0xc2:-1:0
# RPC stays off the internet: loopback plus the explorer's docker bridge.
rpcbind=127.0.0.1
rpcbind=172.29.0.1
rpcallowip=127.0.0.1
rpcallowip=172.29.0.0/24
# Generated at deploy time with share/rpcauth/rpcauth.py gsr-mempool.
rpcauth=gsr-mempool:REPLACE
